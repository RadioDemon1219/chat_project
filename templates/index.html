<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Чат</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="chat">
    <header class="chat-header">
        <h1>Чат</h1>
        <span id="status" class="status offline">не подключён</span>
    </header>

    <ul id="messages" class="messages"></ul>

    <form id="send-form" class="send" autocomplete="off">
        <input id="name" type="text" placeholder="Твоё имя" maxlength="24" required>
        <input id="text" type="text" placeholder="Сообщение..." maxlength="500">
        <button type="submit">Отправить</button>
    </form>
</main>
<script src="/static/app.js"></script>
</body>
</html>
